name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npx vitest run --passWithNoTests

      # Audit gate: bloqueia merge se houver vulnerabilidade high/critical
      # em deps de produção. Dev deps (vite, etc.) são auditadas no
      # passo seguinte mas não bloqueiam.
      - name: Audit production deps (blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit dev deps (informational)
        run: npm audit --audit-level=high || true

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        # As envs abaixo são placeholders apenas para o build estático passar.
        # Não são usadas em runtime — Vercel injeta as reais em produção.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          CLERK_SECRET_KEY: sk_test_placeholder
        run: npm run build
